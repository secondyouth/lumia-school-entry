<title>ルミアAIスクール 第1期生 募集</title>
<meta name="description" content="女性向けAIスクール。AI秘書コースと、新規事業開発コース。2026年秋、第1期生を募集します。">
<meta name="theme-color" content="#0C333B">
<style>
:root{
  --deep:#0C333B; --mid:#155562; --gold:#D8BC82; --gold-deep:#A97F2F;
  --cream:#FBF7F0; --ink:#28343A; --note:#4A555A;
  --teal:#0E9E9A; --teal-deep:#00695C;
  --orange:#E1512F; --orange-deep:#BF3A1B;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:#fff; line-height:2.0; position:relative; overflow-x:hidden;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 80% at 18% 0%, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 58%),
    radial-gradient(90% 60% at 92% 10%, rgba(216,188,130,.16) 0%, rgba(216,188,130,0) 62%),
    linear-gradient(168deg, var(--deep) 0%, var(--mid) 64%, #0E3E49 100%);
  background-attachment:fixed;
}
.ray{position:fixed; pointer-events:none; left:-14%; top:-28%; width:72%; height:130%;
  transform:rotate(-24deg); transform-origin:top left; z-index:1;
  background:linear-gradient(105deg, rgba(255,255,255,0) 12%, rgba(255,255,255,.07) 22%,
    rgba(255,255,255,0) 31%, rgba(255,255,255,.04) 42%, rgba(255,255,255,0) 54%);
  animation:shimmer 10s ease-in-out infinite;}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}

.wrap{position:relative; z-index:2; max-width:560px; margin:0 auto;
  padding:clamp(56px,9vw,90px) 24px clamp(48px,7vw,72px); text-align:center;}
.js .wrap > *{opacity:0; animation:hin .8s cubic-bezier(.2,.6,.2,1) forwards;}
.js .wrap > *:nth-child(1){animation-delay:.1s}
.js .wrap > *:nth-child(2){animation-delay:.4s}
.js .wrap > *:nth-child(3){animation-delay:.7s}
.js .wrap > *:nth-child(4){animation-delay:1s}
@keyframes hin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.head img{width:clamp(150px,34vw,190px); height:auto;}
.head .t{font-family:var(--mincho); font-size:clamp(14px,2.2vw,16px);
  color:rgba(255,255,255,.9); letter-spacing:.18em; margin:20px 0 0;}
.head .s{font-size:clamp(11.5px,1.9vw,13px); color:rgba(255,255,255,.7);
  letter-spacing:.18em; margin:10px 0 0;}

.door{display:block; margin-top:28px; text-align:center; color:var(--ink); text-decoration:none;
  padding:clamp(32px,5vw,44px) clamp(22px,4vw,34px);
  border:1px solid rgba(201,169,106,.6); background:var(--cream);
  box-shadow:0 1px 1px rgba(0,0,0,.04), 0 30px 60px -38px rgba(0,0,0,.5);
  transition:transform .35s ease, border-color .35s ease, background .35s ease;}
.door:hover{transform:translateY(-4px); border-color:rgba(201,169,106,1); background:#fff;}
.kind{font-size:11.5px; font-weight:700; letter-spacing:.42em; text-indent:.42em;
  color:var(--gold-deep); margin:0;}
.cname{font-family:var(--mincho); font-weight:600; letter-spacing:.1em;
  font-size:clamp(21px,5vw,28px); line-height:1.6; margin:12px 0 0; color:var(--ink);}
.desc{font-size:clamp(13.5px,2vw,15px); color:var(--note); margin:16px 0 0;}
.go{display:block; max-width:300px; margin:24px auto 0; color:#fff; text-decoration:none;
  text-align:center; padding:13px 16px 14px; border-radius:999px;
  font-weight:700; letter-spacing:.12em; font-size:16px; line-height:1.5;}
.go .sm{display:block; font-size:11px; font-weight:600; opacity:.9;
  letter-spacing:.08em; line-height:1.6; margin-bottom:1px;}
.door.hisho .go{background:var(--teal); box-shadow:0 8px 20px rgba(14,158,154,.3);}
.door.shinki .go{background:var(--orange); box-shadow:0 8px 20px rgba(225,81,47,.3);}
.go:hover{opacity:.9;}

.foot{margin-top:40px; font-size:12px; line-height:2.1; color:rgba(255,255,255,.6);}
.foot a{color:rgba(255,255,255,.8); text-decoration:underline; text-underline-offset:3px;}
.foot a:hover{color:var(--gold);}
.foot .co{display:block; margin-top:6px; letter-spacing:.12em;}
.w{display:inline-block}
@media (prefers-reduced-motion: reduce){
  .ray{animation:none} .js .wrap > *{animation:none; opacity:1} .door{transition:none}
}
</style>
